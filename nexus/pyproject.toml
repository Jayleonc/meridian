[project]
name = "meridian-nexus"
version = "0.1.0"
description = "Meridian Nexus — MCP 网关"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "mcp>=1.24.0",
    "pydantic>=2.9.0",
    "sse-starlette>=2.1.3",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
