limit_req_zone $binary_remote_addr zone=meridian_demo:10m rate=3r/s;

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_proxied any;
    gzip_comp_level 5;

    client_max_body_size 2m;

    location ~ ^/(atlas|lens|probe|trace|nexus)(/|$) {
        return 403;
    }

    location ~ ^/(api/(atlas|lens|probe|trace|devops|diagnosis|registry)|svc|mcp|registry)(/|$) {
        return 403;
    }

    location / {
        limit_req zone=meridian_demo burst=20 nodelay;

        proxy_pass http://43.138.250.173:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
