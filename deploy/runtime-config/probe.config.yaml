server:
  name: probe
  environment: docker-compose
  host: "0.0.0.0"
  port: 3002
  audit_log_path: /app/logs/probe-audit.log

limits:
  max_lines: 500
  max_bytes: 65536
  max_time_range_hours: 24
  command_timeout_seconds: 10
  max_line_length: 500

security:
  redact_enabled: true

time:
  log_timezone: Asia/Shanghai

paths:
  hourly_log_dir: /data/brick/log
  supervisor_log_dir: /var/log/supervisor
  glog_path: /data/pinfire/tools/glog.sh
