server:
  name: lens
  environment: docker-compose
  host: "0.0.0.0"
  port: 3003
  audit_log_path: /app/logs/lens-audit.log

atlas_url: "http://atlas:3001"

business_mysql:
  host: "172.31.0.6"
  port: 3306
  user: readonly
  password: ""
  database:
    - highlink

business_datasource:
  - name: default-mysql
    type: mysql
    host: "172.31.0.6"
    port: 3306
    user: readonly
    password: ""
    database:
      - highlink

meridian_db:
  host: "host.docker.internal"
  port: 15432
  user: root
  password: ""
  database: meridian

query:
  max_limit: 100
  default_limit: 20
  preview_limit: 20
  default_time_range_days: 7
  timeout_seconds: 30
  require_filter: true

sensitive_fields:
  - phone
  - mobile
  - id_card
  - identity
  - password
  - secret
  - token
