[project]
name = "meridian-trace"
version = "0.1.0"
description = "Meridian Trace — 链路关联 MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "mcp",
    "pydantic>=2.0",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
