services:
  nexus:
    build: ./nexus
    ports:
      - "3000:3000"
    environment:
      ATLAS_URL: http://atlas:3001
      PROBE_URL: http://probe:3002
      LENS_URL: http://lens:3003
    env_file:
      - .env
    command: uv run uvicorn src.server:app --host 0.0.0.0 --port 3000 --no-access-log
    depends_on:
      - probe
      - meridian-db

  probe:
    build: ./probe
    expose:
      - "3002"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 3002 --no-access-log

  lens:
    build: ./lens
    expose:
      - "3003"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 3003 --no-access-log
    depends_on:
      - meridian-db

  trace:
    build: ./trace
    expose:
      - "3004"
    command: uv run uvicorn src.server:app --host 0.0.0.0 --port 3004 --no-access-log
    depends_on:
      - meridian-db

  atlas:
    build: ./atlas
    expose:
      - "3001"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 3001 --no-access-log
    depends_on:
      - meridian-db

  # Meridian 平台自身存储（PostgreSQL）
  # 存放：元数据快照、语义标注、知识条目、变更记录、MCP 配置、审计日志
  # 选 PG 原因：pgvector 支持向量搜索（Codex 知识库），JSON 支持好（元数据快照）
  meridian-db:
    image: postgres:17
    expose:
      - "5432"
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 注意：业务数据库是 MySQL，部署在开发服务器上
  # Atlas 和 Lens 通过配置连接远程业务 MySQL（information_schema / 只读查询）
  # 本地开发时可用下面这个 MySQL 做 mock
  mysql-dev:
    image: mysql:8.0
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: business_mock
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  pgdata:
  mysqldata:
